name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# No token capabilities granted at the workflow level; the job grants its own.
permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # SECURITY (primary control): only run for PRs authored by the repo owner.
    # External / fork PR authors can never trigger Claude, so a hostile PR cannot
    # hijack Claude or the workflow token. This matters most because the repo is
    # PUBLIC — anyone can open a PR.
    if: github.event.pull_request.user.login == 'ddteeter'
    runs-on: ubuntu-latest
    # Least privilege. This is `pull_request` (NOT `pull_request_target`): on a
    # public repo a fork PR would run in the fork's context with a read-only
    # token and NO secrets. Combined with the owner-only gate above, this only
    # ever runs on same-repo PRs where these scopes are intended.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        # actions/checkout@v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        # anthropics/claude-code-action@v1.0.133
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: true
          # No plugin, no subagents. The code-review plugin fanned out to
          # background agents that died when the headless session ended, so the
          # job went green with only a "review agents are running" comment on
          # larger PRs (#122). Its `gh` calls were also denied by the default
          # tool list. Agent/Task are disallowed so the review stays in one
          # session that finishes before the job does; the allowlist is
          # read-only apart from the comment tools that post the review.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view *),Bash(gh pr diff *),Bash(git log *),Bash(git diff *),Bash(git show *),mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent,Task"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Do the whole review yourself, in this session: do not spawn subagents or background tasks, and do not end until the review is posted.

            1. Read `.github/claude-review-prompt.md` (project review guidelines) and `CLAUDE.md`.
            2. Get the change with `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}`. Read changed files in the workspace for surrounding context where the diff alone is not enough.
            3. Review for correctness bugs first, then security and gate-integrity issues per the guidelines, then test quality. Only report findings you have verified against the code; skip style nits the linters already enforce.
            4. Post the review by updating your tracking comment: a one-line verdict (`no blocking issues` or `blocking issues found`), then findings ordered by severity, each with `file:line`, what is wrong, and a concrete failure scenario. Use inline comments only for findings tied to a specific line. If you find nothing, say so explicitly.

            Do not approve, request changes, merge, or push.
