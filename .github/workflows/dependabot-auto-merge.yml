name: Auto-merge Dependabot PRs

# `pull_request_target` is required: Dependabot's own `pull_request` events get a
# read-only token, so auto-approve/merge needs the base-repo token that only
# `pull_request_target` provides. `synchronize` re-arms auto-merge when
# Dependabot rebases/re-pushes; the major-review job deliberately skips it.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# No capabilities at the workflow level; each job grants its own minimum.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Actor is set by GitHub and cannot be spoofed by an outside contributor, so
    # on this PUBLIC repo a fork PR (actor = fork author) never reaches this job.
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    # SECURITY INVARIANT — keep this job free of untrusted code.
    # It runs with contents:write + pull-requests:write under
    # `pull_request_target`, so the workflow definition is always taken from
    # `main` (a malicious PR can't edit it) — but that protection only holds
    # while the job executes NO PR/dependency code. Do NOT add
    # `actions/checkout` of the PR head, `npm ci`/`npm install`, a build, or any
    # step that runs code from the PR or its dependencies to THIS job: a
    # dependency's install/build script could then read GITHUB_TOKEN from the
    # environment. Code that must inspect PR contents belongs in
    # `claude-review-major` below, which checks out PR code but is never given a
    # write-capable token. The default GITHUB_TOKEN is sufficient here (no
    # GitHub App token needed — there is no deploy workflow to re-trigger).
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # dependabot/fetch-metadata@v3
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      # Skip auto-approve on majors — they're reviewed by `claude-review-major`
      # below. A stale ✓ approval on a PR Claude flagged as `hold` would turn it
      # into a one-click merge for a maintainer. Approval is non-gating hygiene;
      # the actual gate is the required `build-test` check.
      - name: Approve PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--auto` arms auto-merge; GitHub performs the squash-merge only once the
      # required `build-test` check passes, so a broken bump can never land. The
      # 7-day Dependabot cooldown (see dependabot.yml) is the supply-chain
      # defense that makes auto-merging minor/patch acceptable.
      - name: Auto-merge minor and patch
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Majors don't auto-merge — they get a Claude-written impact review instead.
  # Runs under `pull_request_target` (secrets access) and DOES execute against
  # PR-modified code (claude-code-action checks out the PR head internally).
  # Security model:
  #   - Actor gate means the PR head is always a Dependabot branch in this repo
  #     (not a fork). Dependabot PRs are mechanical version bumps.
  #   - Permissions narrowed to contents:read + pull-requests:write. Even if
  #     Claude is misled, the only side effect available is posting a comment —
  #     it can't push, approve, or merge.
  #   - Bash allowlist is read-only. No shell exec, no dependency code runs
  #     (no npm install / build), no writes.
  #   - Prompt explicitly forbids approve / request changes / merge / push.
  claude-review-major:
    runs-on: ubuntu-latest
    # Skip on `synchronize` (Dependabot rebase/re-push) so a major PR isn't
    # re-reviewed with a duplicate comment. The auto-merge job still re-arms.
    if: github.actor == 'dependabot[bot]' && github.event.action != 'synchronize'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # dependabot/fetch-metadata@v3
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # claude-code-action does its own `git fetch` of the PR head and needs
      # credentials in the workspace, so persist-credentials stays on here.
      - name: Checkout repository
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        # actions/checkout@v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Claude major-bump review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        # anthropics/claude-code-action@v1.0.133
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: true
          # The action refuses bot-triggered runs unless the bot is listed.
          # Opt in narrowly to dependabot[bot] only — not '*'.
          allowed_bots: 'dependabot[bot]'
          # Token here is scoped by this job's permissions (contents:read +
          # pull-requests:write), so even gh-api writes can't push, approve, or
          # merge — the whole blast radius is reading repo contents and posting
          # one PR comment. Bash allowlist is read-only.
          claude_args: |
            --allowedTools "WebFetch,WebSearch,Bash(gh release view *),Bash(gh release list *),Bash(gh api *),Bash(rg *),Bash(grep *),Bash(cat *),Bash(head *),Bash(ls *)"
          prompt: |
            You are reviewing a Dependabot **major-version** bump on PR #${{ github.event.pull_request.number }}.

            Dependency: ${{ steps.metadata.outputs.dependency-names }}
            Ecosystem: ${{ steps.metadata.outputs.package-ecosystem }}
            Version: ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }}

            The repository at the current workspace is checked out at the PR head. The PR's only changes are version pins for the dependency above; use the workspace to inspect how the dependency is consumed today.

            Do the following, in order:

            1. **Find the changelog/release notes AND any migration guide** for the bump range. Prefer (in order): GitHub releases via `gh release view` / `gh release list`, CHANGELOG.md in the source repo, migration guides linked from release notes. If the bump spans multiple majors, cover every intermediate major too. **Record every URL** you consult — you must cite them in the final comment.

            2. **Extract breaking changes only.** Ignore features and bugfixes. For each breaking change capture: what changed, who is affected, what action is required to stay compatible.

            3. **Check this repo against each breaking change.** Grep/read the codebase — config files, CI workflows, source, lockfile pins, scripts — to determine whether the change applies here. Be concrete: cite file paths and lines. Examples for an action/CLI bump: removed commands/flags still referenced in workflows, removed config keys still present, runtime version floors vs `setup-node`/`engines` pins, default-behavior flips that affect existing invocations.

            4. **Post one PR review comment** (not many) with this structure:
               - One-line verdict: `safe to merge`, `merge with follow-up`, or `hold`.
               - Table of breaking changes with columns: change | affects this repo? | required action (cite file:line if affected).
               - If verdict is not `safe to merge`, a short "what to do next" section.
               - **Sources** section at the bottom — a bulleted list of every URL you consulted.

            Be terse. No preamble, no recap of the PR title, no "I will now…" narration. If a breaking change is irrelevant here, say "no" in one cell — don't explain why.

            Do NOT approve, request changes, merge, or push commits. Comment only.
