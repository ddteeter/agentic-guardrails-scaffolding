# Consumer-facing CI template, written into a target repo by `guardrails init`.
# Uses floating major tags (@v6), not the pinned commit SHAs this repo's own
# workflows use: a SHA pinned into a consumer's repository would rot silently
# under THEIR Dependabot policy, and we cannot update it for them. This repo
# pins because it controls its own supply chain; a consumer controls theirs.
#
# The MAJOR still has to be kept current, which floating does not do for us:
# @v4 rides the node20 runner GitHub is retiring, so every repo scaffolded
# with it inherits deprecation warnings fixable only by editing an OWNED
# file. Keep this in step with the majors `.github/workflows/ci.yml` pins.
name: Guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit gate diffs against the merge-base, which needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # `gate --mode=commit` runs verify PLUS the diff-auditor PLUS the
      # sanction budget. Bare `verify` runs none of the last two.
      #
      # `--mode=commit` verifies at `profile: 'commit'`, and no analyzer
      # currently declares `minRung: 'ci'` -- so commit and ci coverage are
      # identical today. The day one does, this workflow needs a
      # `--mode=ci` step too.
      #
      # Invoked by explicit path rather than `npx guardrails`: npx resolves a
      # bin NAME, and on a misconfigured install it falls through to fetching
      # a registry package called `guardrails`, which this project does not
      # own. The path form can only ever run what `npm ci` installed.
      - run: node ./node_modules/guardrails-core/dist/cli.mjs gate --mode=commit
      - run: node ./node_modules/guardrails-core/dist/cli.mjs sanctions-check
